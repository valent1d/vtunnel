name: Release

# Run JavaScript actions on Node.js 24 ahead of the June 2026 default switch,
# so checkout/setup-go/upload-artifact stop emitting the Node 20 deprecation.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease. Tags with a suffix, like v0.1.0-beta.1, are prereleases automatically."
        required: true
        default: false
        type: boolean
      update_tap:
        description: "Update valent1d/homebrew-tap after publishing the release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${version}" >&2
            echo "Expected a semver tag like v0.1.0 or v0.1.0-beta.1" >&2
            exit 1
          fi
          prerelease="false"
          if [[ "${version}" == *-* ]]; then
            prerelease="true"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease="true"
          fi
          update_tap="true"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.update_tap }}" != "true" ]]; then
            update_tap="false"
          fi
          draft="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.draft }}" == "true" ]]; then
            draft="true"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "update_tap=${update_tap}" >> "${GITHUB_OUTPUT}"
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"

      - name: Test
        run: go test ./...

      - name: Build archives
        run: scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtunnel-${{ steps.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
          DRAFT: ${{ steps.version.outputs.draft }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          args=(--title "${TAG}" --target "${GITHUB_SHA}" --generate-notes)
          if [[ "${DRAFT}" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "${TAG}" dist/*.tar.gz dist/checksums.txt "${args[@]}"
          fi

      - name: Check Homebrew tap token
        if: steps.version.outputs.update_tap == 'true' && steps.version.outputs.draft != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "::error::Missing repository secret HOMEBREW_TAP_TOKEN. Create a fine-grained GitHub token with Contents: Read and write on valent1d/homebrew-tap."
            exit 1
          fi

      - name: Checkout Homebrew tap
        if: steps.version.outputs.update_tap == 'true' && steps.version.outputs.draft != 'true'
        uses: actions/checkout@v4
        with:
          repository: valent1d/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew tap formula
        if: steps.version.outputs.update_tap == 'true' && steps.version.outputs.draft != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VTUNNEL_GITHUB_REPO: valent1d/vtunnel
        shell: bash
        run: |
          set -euo pipefail

          scripts/render-homebrew-formula.sh "${VERSION}" homebrew-tap/Formula/vtunnel.rb
          ruby -c homebrew-tap/Formula/vtunnel.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vtunnel.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
            exit 0
          fi
          git commit -m "Update vtunnel ${VERSION}"
          git push
